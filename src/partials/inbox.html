<!-- Visual de bandeja unificada: canales que se encienden y llegan al hub (JS: modules/ui.js · inbox) -->
<div class="tb-inbox" data-tb-inbox aria-hidden="true">
  <div class="tb-inbox-chips">
    <span class="tb-inbox-ch" style="--tb-ch:var(--tb-ch-whatsapp)"><i></i>WhatsApp</span>
    <span class="tb-inbox-ch" style="--tb-ch:var(--tb-ch-instagram)"><i></i>Instagram</span>
    <span class="tb-inbox-ch" style="--tb-ch:var(--tb-ch-messenger)"><i></i>Messenger</span>
    <span class="tb-inbox-ch" style="--tb-ch:var(--tb-ch-google)"><i></i>Google</span>
    <span class="tb-inbox-ch" style="--tb-ch:var(--tb-ch-sms)"><i></i>SMS</span>
    <span class="tb-inbox-ch" style="--tb-ch:var(--tb-ch-email)"><i></i>Email</span>
    <span class="tb-inbox-ch" style="--tb-ch:var(--tb-ch-web)"><i></i>Chat web</span>
  </div>
  <div class="tb-inbox-hub">
    <span class="tb-inbox-hub-ic"><svg class="tb-ic"><use href="#tb-i-inbox" /></svg></span>

  <ul class="tb-inbox-acts">
    <li><svg class="tb-ic tb-ic-sm"><use href="#tb-i-zap" /></svg>Responde en segundos</li>
    <li><svg class="tb-ic tb-ic-sm"><use href="#tb-i-target" /></svg>Califica y agenda</li>
    <li><svg class="tb-ic tb-ic-sm"><use href="#tb-i-users" /></svg>Asigna a tu equipo</li>

  </ul>
